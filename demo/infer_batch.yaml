# infer_batch.yaml
out_root:  batch_inference           # parent folder for all outputs
script:    demo/schnakenberg_nca_batch_inference.py

mix: "0:4,1:1,2:3,3:3,4:3"           # IC composition, same syntax as CLI

defaults:
  fire_rate:     0.5
  time_sampling: 32
  channels:      16

models:
  - path:  models/...FI0.5_ST1.0_LOeuclidean.eqx
    fire_rate: 0.5        # overrides default
    time_sampling: 64
  - path:  models/...LOspectral_full.eqx       # uses defaults
  - path:  models/...LOl1.eqx
